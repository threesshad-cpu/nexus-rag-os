# NEXUS RAG OS - Render Blueprint Specification
# Deploys both backend (FastAPI Docker service) and frontend (Vite React static site)
services:
  - type: web
    name: nexus-rag-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBED_DIM
        value: "768"
      - key: VECTOR_BACKEND
        value: local
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: nexus-rag
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEXUS_DEMO_MODE
        value: "false"
      - key: NEXUS_ADMIN_TOKEN
        sync: false
      - key: GEMINI_RPM_LIMIT
        value: "15"
      - key: MAX_CHAT_REQUESTS_PER_MINUTE
        value: "10"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: nexus-rag-os-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
